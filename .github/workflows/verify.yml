name: Verify

# Pre-merge verification. The release workflow re-runs the same critical gates on the tag as an
# independent second check, so a green run here is a prerequisite for a release, never a substitute.
on:
    pull_request:
    push:
        branches:
            - master

permissions:
    contents: read

jobs:
    frontend:
        name: Frontend
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Setup Node.js
              uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
              with:
                  node-version-file: '.node-version'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            # `endOfLine: 'auto'` in prettier.config.mjs keeps this green on a Windows checkout
            # with core.autocrlf=true as well as on a Linux runner; do not pin it back to 'lf'.
            - name: Check formatting
              run: npm run format:check

            - name: Type-check
              run: npm run typecheck

            # The `text` reporter writes the summary straight into the job log, so coverage is
            # visible on every run without adding an artifact-upload action to the SHA-pinned set.
            # No threshold is configured: see the note in vite.config.ts.
            - name: Test with coverage
              run: npm run test:coverage

            - name: Build
              run: npm run build

    backend:
        # The catalog reads the registry, walks the filesystem and drives PowerShell and COM, so a
        # green run on one Windows build is not evidence for the other supported one. Formatting and
        # Clippy are image-independent and stay on the rolling label alone; the suite runs on both.
        name: Backend (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, windows-2022]
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  toolchain: 1.96.0
                  targets: x86_64-pc-windows-msvc
                  components: clippy, rustfmt

            - name: Check formatting
              if: matrix.os == 'windows-latest'
              run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

            - name: Lint
              if: matrix.os == 'windows-latest'
              run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

            # Split so a failure names its own cause. The first covers the pure decision layers and
            # the filesystem walks; the second is the only module that starts an external process,
            # and its failures mean something different from a catalog rule breaking. Both are
            # required: the hosted Windows images do ship PowerShell, so these are not flaky tests
            # to be excused with `continue-on-error`.
            - name: Test catalog and platform
              run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --skip catalog::sources::start_apps::tests

            - name: Test PowerShell-backed source
              run: cargo test --locked --manifest-path src-tauri/Cargo.toml catalog::sources::start_apps::tests

    msrv:
        name: MSRV
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            # Pinned to the rust-version declared in src-tauri/Cargo.toml. The manifest states a
            # compatibility promise, so it is compiled rather than asserted.
            - name: Setup declared MSRV toolchain
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  toolchain: '1.88.0'
                  targets: x86_64-pc-windows-msvc

            - name: Check declared MSRV matches the manifest
              shell: pwsh
              run: |
                  $declared = (Select-String -Path src-tauri/Cargo.toml -Pattern '^rust-version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
                  $installed = (& rustc +1.88.0 --version).Split(' ')[1]
                  if ($declared -ne $installed) {
                    throw "Cargo.toml declares MSRV $declared but this job pins $installed; update both together"
                  }

            - name: Build at the declared MSRV
              run: cargo +1.88.0 check --locked --manifest-path src-tauri/Cargo.toml --all-targets

    contracts:
        name: Boundaries and release contract
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
              with:
                  node-version-file: '.node-version'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  toolchain: 1.96.0
                  targets: x86_64-pc-windows-msvc

            - name: Verify frontend dependency boundaries
              shell: pwsh
              run: powershell -NoProfile -File scripts/verify-frontend-boundaries.ps1

            - name: Verify Windows API ownership boundary
              shell: pwsh
              run: powershell -NoProfile -File scripts/verify-platform-boundaries.ps1

            - name: Test release source verification
              shell: pwsh
              run: powershell -NoProfile -File scripts/test-verify-release-source.ps1

            - name: Test release workflow tag transport
              shell: pwsh
              run: powershell -NoProfile -File scripts/test-release-workflow.ps1

            - name: Test release manifest preparation
              shell: pwsh
              run: powershell -NoProfile -File scripts/test-prepare-release-manifest.ps1

            - name: Test release notes preparation
              shell: pwsh
              run: powershell -NoProfile -File scripts/test-release-notes.ps1

            # The soak harness itself is a manual pre-release procedure, but the contract it
            # enforces — bind to one exact PID and executable, never touch anything else — is
            # what keeps that manual run safe, so the test guarding it belongs in CI.
            - name: Test release soak harness
              shell: pwsh
              run: powershell -NoProfile -File scripts/test-run-release-soak.ps1

            - name: Test updater signature verification
              shell: pwsh
              run: powershell -NoProfile -File scripts/test-verify-updater-signature.ps1

            - name: Test updater signature verification wrapper
              shell: pwsh
              run: powershell -NoProfile -File scripts/test-verify-updater-signature-wrapper.ps1

            - name: Test npm audit triage gate
              shell: pwsh
              run: powershell -NoProfile -File scripts/test-verify-npm-audit.ps1

            # Runtime dependencies admit no exceptions.
            - name: Audit runtime dependencies
              run: npm audit --omit=dev --audit-level=high

            - name: Triage development dependency advisories
              shell: pwsh
              run: powershell -NoProfile -File scripts/verify-npm-audit.ps1
